name: Go Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag to validate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Test upstream automation
        run: python3 Scripts/test-upstream.py
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: Patches/libtailscale/*.patch
      - run: Scripts/test-go.sh
