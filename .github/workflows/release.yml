name: Release Swift Package
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing package version (for example 1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: package-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package release
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$RELEASE_TAG^{commit}")" ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; published versions are immutable."
            exit 1
          fi
      - name: Verify published binary checksum
        run: Scripts/verify-release.sh
      - name: Test published Swift package on macOS and iOS
        run: Scripts/test-package.sh
      - name: Publish package release
        run: |
          {
            echo "TailscaleKit $RELEASE_TAG for macOS 15+ and iOS 18+."
            echo
            echo "Official Tailscale: $(cat Tailscale.version)"
            echo "Wrapper: $(git rev-parse HEAD)"
            echo "libtailscale: $(cat libtailscale.ref)"
            echo
            echo "CI verifies the release asset checksum and builds macOS, iOS, and iOS Simulator consumers."
          } > .build/package-release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "TailscaleKit $RELEASE_TAG" --notes-file .build/package-release-notes.md
